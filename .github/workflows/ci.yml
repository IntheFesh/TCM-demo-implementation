# 每次 push / PR 运行 lint 与 tests/。tests/ 不需要网络与 API key，所以这里不配置任何
# secret；需要真实 LLM 的评测在 eval/，不进 CI。data/graph.json 是生成物，
# tests/conftest.py 会在缺失时自动构建。
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (CPU torch first so sentence-transformers does not pull the CUDA build)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q -p no:cacheprovider

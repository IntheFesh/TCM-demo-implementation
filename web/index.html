<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>名医辨证对照</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #f7f7fa;
    --panel: #ffffff;
    --border: #e2e3e8;
    --text: #24262b;
    --muted: #6b6f7a;
    --accent: #3b5bdb;
    --danger: #c0392b;
    --warn-bg: #fff4e5;
    --warn-border: #e08a2b;
    --purple-bg: #efe7fb;
    --purple-border: #8b6fd9;
    --purple-text: #4b2e9e;
    --ye: #1d9e75;
    --wu: #d85a30;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header {
    padding: 20px 24px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 600;
  }
  header .disclaimer {
    font-size: 12.5px;
    color: var(--muted);
  }
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 24px 60px;
  }
  #graph-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 16px;
  }
  #cy {
    width: 100%;
    height: 460px;
    border-radius: 6px;
    background: #fbfbfd;
  }
  #cy-empty {
    height: 460px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
  }
  #divergence-banner {
    display: none;
    background: #fff4e5;
    border: 1px solid var(--warn-border);
    color: #8a4b12;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    margin-bottom: 16px;
  }
  #divergence-banner.show { display: block; }
  #input-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  #complaint {
    width: 100%;
    min-height: 84px;
    resize: vertical;
    font-size: 14px;
    font-family: inherit;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    color: var(--text);
  }
  #complaint:focus { border-color: var(--accent); }
  .input-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
  }
  #status-text {
    font-size: 12.5px;
    color: var(--muted);
  }
  #submit-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 9px 22px;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  #submit-btn:disabled {
    background: #a9b6ec;
    cursor: not-allowed;
  }
  #retriever-mode-label { font-size: 12.5px; color: var(--muted); }
  #retriever-mode {
    padding: 7px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 12.5px;
    background: var(--panel);
    color: var(--text);
  }
  #progress-log {
    display: none;
    margin-top: 10px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--muted);
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    white-space: pre-wrap;
    max-height: 130px;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  #progress-log.show { display: block; }
  #need-input-box {
    display: none;
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
  }
  #need-input-box.show { display: block; }
  #need-input-question {
    font-size: 13.5px;
    color: var(--text);
    margin-bottom: 8px;
  }
  #need-input-answer {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 13.5px;
    outline: none;
  }
  #need-input-answer:focus { border-color: var(--accent); }
  #need-input-submit {
    background: var(--warn-border);
    color: #fff;
    border: none;
    padding: 8px 16px;
    font-size: 13.5px;
    border-radius: 6px;
    cursor: pointer;
  }
  #error-box {
    display: none;
    background: #fdecea;
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    margin-bottom: 16px;
    white-space: pre-wrap;
  }
  #error-box.show { display: block; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
  /* EVAL_MODE 旁路了安全否决时的横幅：不能只在 JSON 里带个 safety_flag 字段、页面上看不出来 */
  #safety-flag-note { display: none; margin: 8px 0; padding: 10px 12px; border: 2px solid #B91C1C; background: #FEF2F2; color: #7F1D1D; font-size: 13px; border-radius: 6px; }
  #safety-flag-note.show { display: block; }
  #results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 780px) {
    #results { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: 17px;
  }
  .card .field {
    font-size: 13.5px;
    margin-bottom: 6px;
    line-height: 1.5;
  }
  .card .field b {
    color: var(--muted);
    font-weight: 500;
    margin-right: 4px;
  }
  .hallucination-warning {
    background: #fdecea;
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 6px;
    margin: 8px 0;
    font-weight: 600;
  }
  /* X2 输出侧安全校验：配伍禁忌红、寒热警告黄、已修正小字 */
  .safety-incompatible {
    background: #fdecea;
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 6px;
    margin: 8px 0;
    font-weight: 600;
  }
  /* 「参西用药」是医家特征展示，不是警告——刻意用青蓝，跟 .hallucination-warning
     的红、.safety-thermal 的橙分开，避免读成"这里有问题"。 */
  .western-drugs {
    background: #e8f4f8;
    border: 1px solid #4a8fa8;
    color: #1f5468;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 6px;
    margin: 8px 0;
  }
  .safety-thermal {
    background: #fff4e5;
    border: 1px solid #d18b00;
    color: #8a5a00;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 6px;
    margin: 8px 0;
  }
  .safety-revised {
    font-size: 12px;
    color: var(--muted, #666);
    margin: 4px 0 0;
  }
  details {
    margin-top: 10px;
    border-top: 1px dashed var(--border);
    padding-top: 8px;
  }
  summary {
    cursor: pointer;
    font-size: 13px;
    color: var(--accent);
  }
  .detail-block {
    font-size: 13px;
    color: var(--text);
    margin-top: 8px;
    line-height: 1.6;
  }
  .detail-block .label {
    color: var(--muted);
    font-size: 12px;
    margin-top: 6px;
  }
  .ref-item {
    font-size: 12.5px;
    color: var(--muted);
  }
  .ref-excerpt {
    margin-top: 4px; padding: 6px 8px; background: #f7f7f9;
    border-left: 2px solid #c7c9d1; font-size: 12px; line-height: 1.6; color: #4a4d55;
  }
  .ref-sym { margin-top: 2px; font-size: 12px; color: #6b6e76; }
  #graph-panel { position: relative; }
  #graph-toolbar {
    position: absolute; top: 10px; right: 12px; z-index: 5; display: flex; gap: 6px;
  }
  .ghost-btn {
    padding: 4px 10px; font-size: 12px; cursor: pointer;
    background: rgba(255,255,255,0.92); color: #4a4d55;
    border: 1px solid #d3d5db; border-radius: 6px; font-family: inherit;
  }
  .ghost-btn:hover { background: #fff; border-color: #a9acb5; }
  #evidence-panel {
    position: fixed; top: 0; right: 0; width: 380px; max-width: 92vw; height: 100vh;
    box-sizing: border-box;
    background: #fff; border-left: 1px solid #e2e3e8; box-shadow: -4px 0 18px rgba(0,0,0,0.06);
    transform: translateX(100%); transition: transform .22s ease-out;
    z-index: 50; display: flex; flex-direction: column;
  }
  #evidence-panel.open { transform: translateX(0); }
  #evidence-head {
    display: flex; min-width: 0; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid #eceef2; flex: 0 0 auto;
  }
  #evidence-title {
    font-weight: 600; font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  #evidence-close {
    border: none; background: transparent; font-size: 22px; line-height: 1;
    cursor: pointer; color: #8b8e96; padding: 0 4px;
  }
  #evidence-close:hover { color: #24262b; }
  #evidence-body {
    padding: 14px 16px; overflow-y: auto; overflow-x: hidden;
    flex: 1 1 auto; font-size: 13px;
    /* 医案原文是连续中文、case_id 是长串，不强制断行会把 fixed 面板撑宽，
       表现为面板左缘跑到页面中间、右缘溢出屏幕 */
    overflow-wrap: anywhere; word-break: break-word;
  }
  #evidence-body * { max-width: 100%; box-sizing: border-box; }
  .ev-sec { margin-bottom: 16px; }
  .ev-sec > .label { font-size: 11px; color: #8b8e96; margin-bottom: 5px; }
  .ev-case {
    border: 1px solid #e6e7eb; border-radius: 6px; padding: 9px 10px; margin-bottom: 9px;
  }
  .ev-case .cid { font-weight: 600; font-size: 12px; }
  .ev-case .meta { font-size: 11px; color: #8b8e96; margin: 3px 0 5px; }
  .ev-raw {
    background: #f7f7f9; border-left: 2px solid #c7c9d1; padding: 7px 9px;
    font-size: 12px; line-height: 1.7; color: #4a4d55;
    max-height: 90px; overflow: hidden; position: relative;
  }
  .ev-raw.expanded { max-height: none; }
  .ev-more {
    font-size: 11px; color: #3b6fd8; cursor: pointer; margin-top: 4px; display: inline-block;
  }
  #cy .cy-clickable { cursor: pointer; }
  /* .gt-tooltip：模块6的 hover tooltip 视觉样式，改成类而不是 #graph-tooltip 这个
     具体 id——图谱浏览器（模块7）的画布是另一个 cytoscape 实例、另一个容器，
     要用同一套视觉但挂在不同的 DOM 节点上，用类选择器两边共用，不重复抄一份。 */
  .gt-tooltip {
    display: none;
    position: absolute;
    z-index: 20;
    max-width: 260px;
    padding: 8px 10px;
    background: #24262b;
    color: #f2f2f4;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.6;
    pointer-events: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.22);
  }
  .gt-tooltip.show { display: block; }
  .gt-tooltip b { color: #fff; }
  .gt-tooltip .tt-meta { color: #b9bcc4; margin-top: 2px; }

  /* ---------- 模块7：图谱浏览器页签 ---------- */
  #tab-bar {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 24px 0;
    display: flex;
    gap: 6px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 8px 14px;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab-panel[hidden] { display: none; }

  #gb-lambda1-note {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: #7a4a12;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    line-height: 1.7;
    margin-bottom: 12px;
  }
  #gb-error-box {
    display: none;
    background: #fdecea;
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    margin-bottom: 16px;
  }
  #gb-error-box.show { display: block; }
  #gb-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
  }
  #gb-search {
    flex: 1;
    min-width: 160px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }
  #gb-search:focus { border-color: var(--accent); }
  #gb-search-status { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  #gb-physician-select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    background: var(--panel);
  }
  #gb-panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
  }
  #gb-cy {
    width: 100%;
    height: 520px;
    border-radius: 6px;
    background: #fbfbfd;
  }
  #gb-empty-hint {
    position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }
  #gb-empty-hint[hidden] { display: none; }
  #gb-stats {
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  #gb-cy .gb-search-hit { border-width: 3px !important; }
</style>
</head>
<body>

<header>
  <h1>名医辨证对照</h1>
  <div class="disclaimer">教学与研究用途，非诊断工具，不能替代执业医师</div>
</header>

<div id="tab-bar">
  <button class="tab-btn active" id="tab-btn-consult" data-tab="consult">问诊</button>
  <button class="tab-btn" id="tab-btn-graph-browser" data-tab="graph-browser">图谱浏览器</button>
</div>

<main>
<div id="tab-consult" class="tab-panel">
  <div id="divergence-banner"></div>
  <div id="error-box"></div>
  <div id="safety-flag-note"></div>

  <div id="graph-panel">
    <div id="graph-toolbar">
      <button class="ghost-btn" id="skip-btn" title="立即显示终态">⏭ 跳过动画</button>
      <button class="ghost-btn" id="replay-btn" title="重新播放生长过程">↻ 重播</button>
    </div>
    <div id="cy"></div>
    <div id="residual-note" style="display:none;position:absolute;bottom:26px;left:14px;font-size:12px;color:#C2410C;"></div>
  <div id="graph-note" style="display:none;position:absolute;bottom:8px;left:14px;font-size:12px;color:#9a6b2f;"></div>
  <div id="graph-tooltip" class="gt-tooltip"></div>
  </div>

  <div id="input-panel">
    <textarea id="complaint" placeholder="请输入患者主诉，例如：胃脘胀痛，食后加重，嗳气泛酸，舌淡红苔薄白，脉弦。"></textarea>
    <div class="input-row">
      <span id="status-text"></span>
      <label id="retriever-mode-label" for="retriever-mode">检索模式</label>
      <select id="retriever-mode">
        <option value="">默认</option>
        <option value="hybrid">hybrid（稠密+BM25 融合）</option>
        <option value="dense">dense（稠密向量）</option>
        <option value="bm25">bm25（关键词）</option>
        <option value="graph">graph（证素索引）</option>
      </select>
      <button id="submit-btn">辨证</button>
    </div>
    <div id="progress-log"></div>
    <div id="need-input-box">
      <div id="need-input-question"></div>
      <div class="input-row" style="justify-content: flex-start;">
        <input type="text" id="need-input-answer" placeholder="请输入回答，例如：有 / 没有" />
        <button id="need-input-submit">回答</button>
      </div>
    </div>
  </div>

  <div id="results"></div>

  <div id="manifest-footer" style="margin:18px 0 8px;font-size:11px;color:#9a9da5;text-align:center;"></div>
</div>

<div id="tab-graph-browser" class="tab-panel" hidden>
  <div id="gb-lambda1-note"></div>
  <div id="gb-error-box"></div>
  <div id="gb-toolbar">
    <input type="text" id="gb-search" placeholder="搜索症状 / 证素 / 证型…" />
    <button class="ghost-btn" id="gb-search-btn">搜索</button>
    <span id="gb-search-status"></span>
    <select id="gb-physician-select"></select>
    <button class="ghost-btn" id="gb-layer-toggle" hidden>切换到医案层</button>
    <button class="ghost-btn" id="gb-reset-btn">重置视图</button>
  </div>
  <div id="gb-panel">
    <div id="gb-cy"></div>
    <div id="gb-tooltip" class="gt-tooltip"></div>
    <div id="gb-empty-hint">加载中…</div>
  </div>
  <div id="gb-stats"></div>
</div>
</main>
<aside id="evidence-panel">
    <div id="evidence-head">
      <span id="evidence-title"></span>
      <button id="evidence-close" title="关闭">×</button>
    </div>
    <div id="evidence-body"></div>
  </aside>


<script>
// 配色由 /api/consult 响应里的 result.color 提供（源头是 core/physicians.py）。
// 这里只保留图渲染用的运行时缓存，每次响应回来时填充。
let PHYSICIAN_COLORS = {};
// hover tooltip 用：herb 节点的 data 里只带 phys（id），不带 pname（syn 节点带了，
// herb 没有——to_graph() 没为 herb 节点重复存一份，这里在前端补一份映射，不是
// 因为后端漏了字段，是没必要为一个纯展示用途改后端契约（模块6"不改后端"）。
let PHYSICIAN_NAMES = {};
// layer 4（药材）跟 layer 3（方剂）的 x 只差一小段——compound 子节点要贴着
// 父节点画，隔太远 cytoscape 算出来的方剂包围盒会变成横跨整个画布的细长条，
// 不会像"一个方框里装着自己的药"。
const LAYER_X = { 0: 60, 1: 260, 2: 460, 3: 640, 4: 730 };
const Y_MIN = 60, Y_MAX = 460;

let cy = null;

function evenY(index, total) {
  if (total <= 1) return (Y_MIN + Y_MAX) / 2;
  return Y_MIN + (Y_MAX - Y_MIN) * (index / (total - 1));
}

function computeLayout(nodes, edges) {
  const positions = {};
  const byLayer = { 0: [], 1: [], 2: [], 3: [], 4: [] };
  for (const n of nodes) {
    const L = Number(n.data.layer);
    if (!byLayer[L]) byLayer[L] = [];   // 兜底：layer 不在 0-4 时不要整页崩
    byLayer[L].push(n);
  }

  // layer 0 保持原始顺序（症状顺序有语义，是 S1 抽取的顺序）
  (byLayer[0] || []).forEach((n, i) => {
    positions[n.data.id] = { x: LAYER_X[0], y: evenY(i, byLayer[0].length) };
  });

  // layer 1/2 按"上游邻居的平均位置"排序（重心排序），减少边交叉。
  // 不做这一步的话，层内顺序取决于节点数组的原始顺序，
  // 上下游顺序不一致时边会交叉成 X。
  const yOf = (id) => (positions[id] ? positions[id].y : null);
  for (const layer of [1]) {
    const items = byLayer[layer] || [];
    const bary = new Map();
    for (const n of items) {
      const ys = [];
      for (const e of edges) {
        if (e.data.target === n.data.id) {
          const y = yOf(e.data.source);
          if (y !== null) ys.push(y);
        }
      }
      bary.set(n.data.id, ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : Number.MAX_SAFE_INTEGER);
    }
    const sorted = [...items].sort((a, b) => bary.get(a.data.id) - bary.get(b.data.id));
    sorted.forEach((n, i) => {
      positions[n.data.id] = { x: LAYER_X[layer], y: evenY(i, sorted.length) };
    });
  }

  // layer 2 证型：按医家分上下两带，与 layer 3 的方剂带对齐。
  // 不能用重心排序——两位医家的证型上游证素高度重叠，重心值接近，
  // 排序结果近乎随机，会把两个证型甩到画布上下两端，边被迫斜穿全图。
  const physOrder = [];
  for (const n of byLayer[2]) {
    if (!physOrder.includes(n.data.phys)) physOrder.push(n.data.phys);
  }
  const formulaByPhys = {};
  for (const n of byLayer[3]) {
    (formulaByPhys[n.data.phys] = formulaByPhys[n.data.phys] || []).push(n);
  }
  // M5：药材（layer 4）现在是方剂（layer 3）的 compound 子节点，按 parent
  // 分组而不是按医家分组——同一位医家的 2-3 个候选方各自带一群不同的药，
  // 混在一个医家带里排布会让不同方剂的药材彼此穿插。
  const herbsByFormula = {};
  for (const n of byLayer[4]) {
    (herbsByFormula[n.data.parent] = herbsByFormula[n.data.parent] || []).push(n);
  }
  const gap = 40;

  // layer 2 按同一套医家带排布，保证证型与它的方剂在同一水平区间
  const synByPhys = {};
  for (const n of byLayer[2]) {
    (synByPhys[n.data.phys] = synByPhys[n.data.phys] || []).push(n);
  }
  const bandCount2 = physOrder.length || 1;
  const bandHeight2 = (Y_MAX - Y_MIN - gap * (bandCount2 - 1)) / bandCount2;
  physOrder.forEach((phys, bandIdx) => {
    const bandTop = Y_MIN + bandIdx * (bandHeight2 + gap);
    const items = synByPhys[phys] || [];
    items.forEach((n, i) => {
      const y = items.length <= 1
        ? bandTop + bandHeight2 / 2
        : bandTop + (bandHeight2 * i) / (items.length - 1);
      positions[n.data.id] = { x: LAYER_X[2], y };
    });
  });

  // layer 3 方剂：跟 layer 2 一样按医家分带排布。每个方剂算出 y 之后，
  // 它下属的每味药材（layer 4）紧贴着这个 y 纵向小间距聚成一小簇——
  // cytoscape compound 节点的包围盒是按子节点位置自动算出来的，子节点越贴近
  // 父节点给定的位置，画出来的方剂框就越像"一个方框里装着自己的药"，
  // 而不是横跨整个画布的细长条。
  const bandCount = physOrder.length || 1;
  const bandHeight = (Y_MAX - Y_MIN - gap * (bandCount - 1)) / bandCount;
  physOrder.forEach((phys, bandIdx) => {
    const bandTop = Y_MIN + bandIdx * (bandHeight + gap);
    const items = formulaByPhys[phys] || [];
    items.forEach((n, i) => {
      const y = items.length <= 1 ? bandTop + bandHeight / 2 : bandTop + (bandHeight * i) / (items.length - 1);
      positions[n.data.id] = { x: LAYER_X[3], y };

      const herbs = herbsByFormula[n.data.id] || [];
      const herbSpan = Math.min(90, 16 * Math.max(herbs.length - 1, 0));
      herbs.forEach((h, hi) => {
        const hy = herbs.length <= 1
          ? y
          : y - herbSpan / 2 + (herbSpan * hi) / (herbs.length - 1);
        positions[h.data.id] = { x: LAYER_X[4], y: hy };
      });
    });
  });

  return positions;
}

function buildStylesheet() {
  const style = [
    {
      selector: "node",
      style: {
        shape: "round-rectangle",
        label: "data(label)",
        "text-valign": "center",
        "text-halign": "center",
        "font-size": 11,
        color: "#24262b",
        "background-color": "#f4f4f6",
        "border-width": 1,
        "border-color": "#c7c9d1",
        padding: "6px",
        width: "label",
        height: "label",
        "text-wrap": "wrap",
        "text-max-width": "90px",
      },
    },
    {
      selector: 'node[layer = 0][state = "residual"]',
      style: {
        "background-color": "#fdf1ea",
        "border-color": "#C2410C",
        "border-width": 2,
      },
    },
    {
      selector: "node[residual]",
      style: { "border-color": "#C2410C", "border-width": 2, "border-style": "dashed" },
    },
    {
      selector: "edge[residual]",
      style: { "line-color": "#C2410C", "target-arrow-color": "#C2410C", "line-style": "dashed" },
    },
    {
      selector: 'node[layer = 0][state = "unexplained"]',
      style: {
        "background-color": "#fff4e5",
        "border-color": "#e08a2b",
        "border-style": "dashed",
        "border-width": 2,
      },
    },
    {
      selector: "node[layer = 1]",
      style: {
        "background-color": "#efe7fb",
        "border-color": "#8b6fd9",
        color: "#4b2e9e",
      },
    },
    {
      // M5：方剂（layer 3）现在是 compound 父节点，:parent 是 cytoscape 内建的
      // 伪类选择器，匹配"带子节点的节点"，不用按 layer 另判一次。父节点框要
      // 半透明——不透明会把里面的药材（子节点）整个盖住看不见。
      selector: "node:parent",
      style: {
        "background-opacity": 0.12,
        "border-width": 2,
        "text-valign": "top",
        "text-halign": "center",
        padding: "14px",
      },
    },
    {
      // source 三档的边框区分：classic 用默认实线不用另写规则，
      // modified 虚线，composed 点线。
      selector: 'node[layer = 3][source = "modified"]',
      style: { "border-style": "dashed" },
    },
    {
      selector: 'node[layer = 3][source = "composed"]',
      style: { "border-style": "dotted" },
    },
    {
      selector: "edge",
      style: {
        width: 1.4,
        "line-color": "#d3d5db",
        "target-arrow-color": "#d3d5db",
        "target-arrow-shape": "triangle",
        "curve-style": "bezier",
        "arrow-scale": 0.7,
        opacity: 0.85,
      },
    },
  ];
  for (const [phys, color] of Object.entries(PHYSICIAN_COLORS)) {
    style.push({
      selector: `node[layer > 1][phys = "${phys}"]`,
      style: { "background-color": color, "border-color": color, color: "#ffffff" },
    });
    style.push({
      selector: `edge[phys = "${phys}"]`,
      style: { "line-color": color, "target-arrow-color": color },
    });
  }
  // selected/safety_blocking 要放在医家配色循环之后：医家配色规则也会设
  // border-color，样式表按声明顺序层叠（后面的覆盖前面同名属性），选中框和
  // 安全拦截的红框必须始终盖过医家色，不能被医家配色循环反过来盖掉。
  style.push({
    // [?field] 是 cytoscape 的"布尔真值"选择器，跟内建的 :selected（用户
    // 交互选中状态）是两回事——这里选的是我们自己的数据字段
    // data.selected（这位医家当前选中的候选方），别选错成 :selected。
    selector: "node[?selected]",
    style: { "border-width": 3 },
  });
  style.push({
    selector: "node[?safety_blocking]",
    style: { "border-color": "#dc2626", "border-width": 3 },
  });
  return style;
}

// ---------- hover tooltip ----------
//
// 跟点击打开的侧栏（openEvidence/EVIDENCE）是两件事：侧栏给的是完整证据链
// （推理过程、引用医案、取证轨迹……），要点开才看；hover 给的是"这个节点/
// 这条边是什么"的一句话速览，划过去就有，不用点。数据不查 EVIDENCE——
// EVIDENCE 是按"这条结论的完整依据"组织的，字段比这里需要的重得多，
// hover 直接读 cytoscape 节点/边自身的 data() 就够，两者故意不复用同一份
// 组装逻辑，因为回答的不是同一个问题（同一条例外，CLAUDE.md 对
// core/safety.py 危重词表不并进 SYNONYMS 是同一个理由）。
//
// 五种节点类型（层 0-4：症状/证素/病名证型/方剂/药材，M5 把原来的层 3
// "用药" 拆成方剂+药材两层）各一句 + 边一句，加起来是"6 种可 hover 的
// 东西"——不是又多出一种新节点类型，是 5 类节点 + 边。

// data.node_type 存在 = 持久知识图谱（图谱浏览器，模块7）的节点；
// data.layer 存在 = 单次问诊图（模块6）的节点。两种数据形状不同，但都回答
// "这个节点是什么"这一句话速览，复用同一个函数、同一套 showTooltip/hideTooltip，
// 不为图谱浏览器另起一套 tooltip 逻辑。
function describeNodeTooltip(data) {
  if (data.node_type) {
    switch (data.node_type) {
      case "symptom":
        return `<b>症状</b>　${escapeHtml(data.label)}`;
      case "element": {
        const catLabel = data.category === "location" ? "病位" : data.category === "nature" ? "病性" : (data.category || "");
        return `<b>证素</b>　${escapeHtml(data.label)}<div class="tt-meta">${escapeHtml(catLabel)}</div>`;
      }
      case "syndrome": {
        const lines = [`<b>证型</b>　${escapeHtml(data.label)}${data.is_category ? "　（类目）" : ""}`];
        if (data.definition) lines.push(`<div class="tt-meta">${escapeHtml(data.definition)}</div>`);
        if (data.tongue_pulse) lines.push(`<div class="tt-meta">${escapeHtml(data.tongue_pulse)}</div>`);
        return lines.join("");
      }
      case "case":
        return `<b>医案</b>　${escapeHtml(data.label)}`;
      default:
        return escapeHtml(data.label || data.id || "");
    }
  }
  const physName = data.pname || PHYSICIAN_NAMES[data.phys] || data.phys || "";
  switch (data.layer) {
    case 0: {
      const stateLabel = { explained: "已解释", residual: "残差辨证补充解释", unexplained: "未解释" }[data.state] || data.state || "";
      return `<b>症状</b>　${escapeHtml(data.label)}<div class="tt-meta">${escapeHtml(stateLabel)}</div>`;
    }
    case 1: {
      const kindLabel = data.kind === "location" ? "病位" : data.kind === "nature" ? "病性" : (data.kind || "");
      return `<b>证素</b>　${escapeHtml(data.label)}<div class="tt-meta">${escapeHtml(kindLabel)}${data.residual ? "　（残差辨证补充）" : ""}</div>`;
    }
    case 2:
      return `<b>证型</b>　${escapeHtml(data.label)}<div class="tt-meta">${escapeHtml(physName)}</div>`;
    case 3: {
      // M5：层 3 从"用药"改成"方剂"，用药下沉到层 4。
      const srcLabel = { classic: "经典方", modified: "加减方", composed: "自拟方" }[data.source] || data.source || "";
      const flags = [];
      if (data.selected) flags.push("★已选");
      if (data.safety_blocking) flags.push("⚠ 安全拦截");
      const meta = [physName, srcLabel, flags.join("　")].filter(Boolean).join("　");
      return `<b>方剂</b>　${escapeHtml(data.label)}<div class="tt-meta">${escapeHtml(meta)}</div>`;
    }
    case 4: {
      const parts = [physName];
      if (data.role) parts.push(`${data.role}药`);
      if (data.dose != null) parts.push(`${data.dose}${data.unit || ""}`);
      if (data.decoction) parts.push(data.decoction);
      return `<b>药材</b>　${escapeHtml(data.label)}<div class="tt-meta">${escapeHtml(parts.filter(Boolean).join("　"))}</div>`;
    }
    default:
      return escapeHtml(data.label || data.id || "");
  }
}

function describeEdgeTooltip(edgeData, sourceLabel, targetLabel, currentPhysician) {
  if (edgeData.edge_type) {
    // 持久知识图谱的边：indicates（症状->证素）带 is_cardinal/λ1，
    // composes（证素->证型）不带 per-physician 权重，两者分开描述。
    const lines = [`${escapeHtml(sourceLabel || "?")} → ${escapeHtml(targetLabel || "?")}　<span class="tt-meta">(${escapeHtml(edgeData.edge_type)})</span>`];
    if (edgeData.edge_type === "indicates") {
      lines.push(`<div class="tt-meta">${edgeData.is_cardinal ? "主症" : "次症"}</div>`);
      if (currentPhysician && edgeData.lambda1_by_physician) {
        const l1 = edgeData.lambda1_by_physician[currentPhysician];
        if (l1 !== undefined) {
          lines.push(`<div class="tt-meta">λ1（${escapeHtml(PHYSICIAN_NAMES[currentPhysician] || currentPhysician)}）= ${l1.toFixed(2)}</div>`);
        }
      }
    }
    return lines.join("");
  }
  const physName = edgeData.pname || PHYSICIAN_NAMES[edgeData.phys] || edgeData.phys || "";
  const lines = [`${escapeHtml(sourceLabel || "?")} → ${escapeHtml(targetLabel || "?")}`];
  if (physName) lines.push(`<div class="tt-meta">${escapeHtml(physName)}</div>`);
  if (edgeData.residual) lines.push('<div class="tt-meta">残差辨证补充的连线</div>');
  return lines.join("");
}

// panelId/tooltipId 可传：图谱浏览器（模块7）的画布是另一个 cytoscape 实例、
// 另一个容器，要用同一套定位/显示逻辑但挂在不同的 DOM 节点上，不为它另写
// 一份 showTooltip/hideTooltip——默认值就是原来 per-consult 图那两个 id，
// 老调用方不用改。
function showTooltip(html, clientX, clientY, panelId = "graph-panel", tooltipId = "graph-tooltip") {
  const tip = document.getElementById(tooltipId);
  const panel = document.getElementById(panelId);
  const panelRect = panel.getBoundingClientRect();
  tip.innerHTML = html;
  tip.classList.add("show");
  // 先显示、量出真实尺寸，再据此把 tooltip 夹在画布范围内——鼠标贴着
  // 右/下边缘时不这么做的话，tooltip 会被裁出可视区域，看不全。
  const tipRect = tip.getBoundingClientRect();
  let left = clientX - panelRect.left + 14;
  let top = clientY - panelRect.top + 14;
  left = Math.min(left, panel.clientWidth - tipRect.width - 6);
  top = Math.min(top, panel.clientHeight - tipRect.height - 6);
  tip.style.left = `${Math.max(6, left)}px`;
  tip.style.top = `${Math.max(6, top)}px`;
}

function hideTooltip(tooltipId = "graph-tooltip") {
  document.getElementById(tooltipId).classList.remove("show");
}

function ensureCanvas() {
  // 画布只建一次。生长动画需要 cy.add() 往已有画布上分批追加元素，
  // 每次 destroy 重建就没有"增量"可言了。
  if (cy) return cy;
  cy = cytoscape({
    container: document.getElementById("cy"),
    elements: [],
    style: buildStylesheet(),
    layout: { name: "preset" },
    userZoomingEnabled: true,
    userPanningEnabled: true,
    boxSelectionEnabled: false,
  });
  cy.on("tap", "node", (evt) => openEvidence(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) closeEvidence();
  });
  cy.on("mouseover", "node", (evt) => {
    showTooltip(describeNodeTooltip(evt.target.data()), evt.originalEvent.clientX, evt.originalEvent.clientY);
  });
  cy.on("mousemove", "node", (evt) => {
    showTooltip(describeNodeTooltip(evt.target.data()), evt.originalEvent.clientX, evt.originalEvent.clientY);
  });
  // 直接把 hideTooltip 当回调传，cytoscape/DOM 会把它们自己的事件对象当第一个
  // 参数传进来，正好落进 hideTooltip(tooltipId=...) 那个默认参数的位置，把
  // "graph-tooltip" 这个默认值顶掉——包一层箭头函数、不透传参数，才是真的调用
  // "无参版本"。
  cy.on("mouseout", "node", () => hideTooltip());
  cy.on("mouseover", "edge", (evt) => {
    const e = evt.target;
    showTooltip(
      describeEdgeTooltip(e.data(), e.source().data("label"), e.target().data("label")),
      evt.originalEvent.clientX, evt.originalEvent.clientY
    );
  });
  cy.on("mousemove", "edge", (evt) => {
    const e = evt.target;
    showTooltip(
      describeEdgeTooltip(e.data(), e.source().data("label"), e.target().data("label")),
      evt.originalEvent.clientX, evt.originalEvent.clientY
    );
  });
  cy.on("mouseout", "edge", () => hideTooltip());
  // 兜底：鼠标整个离开画布这件事单独用原生 DOM mouseleave 盯一道，不完全
  // 依赖 cytoscape 自己那套"逐帧 hit-test 出有没有悬停元素"的合成事件。
  // 真实验证时发现，鼠标从节点直接"瞬移"到画布外（不经过中间帧）的极端
  // 情况下，cytoscape 的 node mouseout 有几率没触发，tooltip 会卡住不消失
  // ——真实鼠标移动是连续多帧、不会瞬移，用户手动移开基本不会撞上这条，
  // 但原生 mouseleave 是浏览器对"指针真的离开了这个元素"的保证，不依赖
  // canvas 内部逐帧算出来的悬停状态，加一道更保险。
  document.getElementById("cy").addEventListener("mouseleave", () => hideTooltip());
  return cy;
}

// ---------- 模块7：图谱浏览器（持久知识图谱，跟上面 per-consult 图是两回事）----------
//
// GET /api/graph 一次性把整张图（symptom/element/syndrome，这个 sandbox 里没有
// case 层）都发过来——123 个节点、377 条边，一次响应装得下，没必要做服务端
// 分页/按需查询这类复杂度（demo 阶段不过度设计）。"渐进式展开"因此是纯前端的
// 显示策略：拿到全量数据后先只画证型节点，点开才把它连着的证素/症状加进
// 画布，不是一次性把 123 个节点全铺开——那样会是一团看不出结构的乱线。

let gbCy = null;
let gbGraphData = null;         // GET /api/graph 的原始响应，一次性拿全量，之后全部本地过滤/展开
let gbIndex = null;             // { nodeById, edgesByNode }，拿到数据后建一次，避免每次展开都线性扫全部边
let gbVisibleIds = new Set();   // 当前画布上已经显示的节点 id
let gbCurrentPhysician = null;
let gbShowCaseLayer = false;    // 只有 has_case_layer 为真时这个开关才有意义（按钮本身也只在那时才显示）

function buildGraphBrowserStylesheet() {
  return [
    {
      selector: "node",
      style: {
        // is_category 决定形状用函数值而不是 CSS 选择器匹配布尔字段——避免
        // 对 cytoscape 选择器语法里"布尔真值怎么写"这件事做不必要的猜测，
        // 函数值直接读 JS 里的布尔值，语义没有歧义。
        shape: (ele) => (ele.data("is_category") ? "diamond" : "round-rectangle"),
        label: "data(label)", "text-valign": "center", "text-halign": "center",
        "font-size": 11, color: "#24262b", "background-color": "#f4f4f6",
        "border-width": 1, "border-color": "#c7c9d1", padding: "6px",
        width: "label", height: "label", "text-wrap": "wrap", "text-max-width": "90px",
      },
    },
    { selector: 'node[node_type = "element"]', style: { "background-color": "#efe7fb", "border-color": "#8b6fd9", color: "#4b2e9e" } },
    { selector: 'node[node_type = "syndrome"]', style: { "background-color": "#e8f4f8", "border-color": "#2f7d95", color: "#1a4652" } },
    { selector: 'node[node_type = "case"]', style: { "background-color": "#fdf1ea", "border-color": "#C2410C", color: "#7a2c07" } },
    { selector: "node.gb-search-hit", style: { "border-width": 3 } },
    {
      selector: "edge",
      style: {
        width: 1.4, "line-color": "#d3d5db", "target-arrow-color": "#d3d5db",
        "target-arrow-shape": "triangle", "curve-style": "bezier", "arrow-scale": 0.7,
      },
    },
  ];
}

function ensureGraphBrowserCanvas() {
  if (gbCy) return gbCy;
  gbCy = cytoscape({
    container: document.getElementById("gb-cy"),
    elements: [],
    style: buildGraphBrowserStylesheet(),
    // per-consult 图（cy）用 preset 布局：症状/证素/病名证型/方剂/药材天然分层
    // （药材是方剂的 compound 子节点），坐标是 computeLayout() 算好摆的。
    // 这张图没有那种天然分层——点开才逐步长大，
    // 每次新增节点后都要重新摆位，cose 力导向布局适合这种"节点集合会变"的场景。
    layout: { name: "preset" },
    userZoomingEnabled: true,
    userPanningEnabled: true,
    boxSelectionEnabled: false,
  });
  gbCy.on("tap", "node", (evt) => gbExpandNode(evt.target.id()));
  gbCy.on("mouseover", "node", (evt) => {
    showTooltip(describeNodeTooltip(evt.target.data()), evt.originalEvent.clientX, evt.originalEvent.clientY, "gb-panel", "gb-tooltip");
  });
  gbCy.on("mousemove", "node", (evt) => {
    showTooltip(describeNodeTooltip(evt.target.data()), evt.originalEvent.clientX, evt.originalEvent.clientY, "gb-panel", "gb-tooltip");
  });
  gbCy.on("mouseout", "node", () => hideTooltip("gb-tooltip"));
  gbCy.on("mouseover", "edge", (evt) => {
    const e = evt.target;
    showTooltip(
      describeEdgeTooltip(e.data(), e.source().data("label"), e.target().data("label"), gbCurrentPhysician),
      evt.originalEvent.clientX, evt.originalEvent.clientY, "gb-panel", "gb-tooltip"
    );
  });
  gbCy.on("mousemove", "edge", (evt) => {
    const e = evt.target;
    showTooltip(
      describeEdgeTooltip(e.data(), e.source().data("label"), e.target().data("label"), gbCurrentPhysician),
      evt.originalEvent.clientX, evt.originalEvent.clientY, "gb-panel", "gb-tooltip"
    );
  });
  gbCy.on("mouseout", "edge", () => hideTooltip("gb-tooltip"));
  document.getElementById("gb-cy").addEventListener("mouseleave", () => hideTooltip("gb-tooltip"));
  return gbCy;
}

function gbBuildIndex() {
  const nodeById = new Map();
  for (const n of gbGraphData.graph.nodes) nodeById.set(n.data.id, n);
  const edgesByNode = new Map();
  for (const e of gbGraphData.graph.edges) {
    const { source, target } = e.data;
    if (!edgesByNode.has(source)) edgesByNode.set(source, []);
    if (!edgesByNode.has(target)) edgesByNode.set(target, []);
    edgesByNode.get(source).push(e);
    edgesByNode.get(target).push(e);
  }
  gbIndex = { nodeById, edgesByNode };
}

function gbApplyPhysicianWeighting() {
  if (!gbCy) return;
  gbCy.edges().forEach((ele) => {
    const l1map = ele.data("lambda1_by_physician");
    let opacity = 1;
    if (l1map && gbCurrentPhysician && l1map[gbCurrentPhysician] !== undefined) {
      // λ1 目前恒为 0（原因如实写在 gb-lambda1-note 里）。opacity 直接等于 λ1
      // 的话全部边会变成完全透明，图看起来像渲染坏了——用一个下限 + 线性映射，
      // 数字依然如实反映 λ1（0 时最淡但看得见，1 时最实），不是在掩盖那个 0。
      opacity = 0.25 + 0.75 * l1map[gbCurrentPhysician];
    }
    ele.style("opacity", opacity);
  });
}

// 新增节点/边只加不减（不做"点一下收起"）：这一轮的范围是"渐进式展开"，
// 没有要求可折叠；加一套折叠状态管理会把这个模块的复杂度顶到跟本身价值
// 不成比例，需要的话留给下一轮。
function gbAddNodes(nodeIds) {
  ensureGraphBrowserCanvas();
  const toAdd = [];
  for (const id of nodeIds) {
    if (gbVisibleIds.has(id)) continue;
    const n = gbIndex.nodeById.get(id);
    if (!n) continue;
    // 医案层没打开时不显示 case 节点——has_case_layer 为假时按钮本身都不出现
    // （见 loadGraphBrowserData），这里再挡一道是防"从别的节点展开时，边的
    // 另一端恰好是 case 节点"这种间接泄漏。
    if (n.data.node_type === "case" && !gbShowCaseLayer) continue;
    toAdd.push({ data: n.data });
    gbVisibleIds.add(id);
  }
  if (toAdd.length) gbCy.add(toAdd);

  // 两端都已经在画布上的边才补上——判据跟 api/main.py::to_graph() 的
  // add_edge 是同一个道理（两端节点都存在，边才有意义），不是巧合。
  const edgesToAdd = [];
  for (const e of gbGraphData.graph.edges) {
    const { id, source, target } = e.data;
    if (gbCy.getElementById(id).nonempty()) continue;
    if (!gbVisibleIds.has(source) || !gbVisibleIds.has(target)) continue;
    edgesToAdd.push({ data: e.data });
  }
  if (edgesToAdd.length) gbCy.add(edgesToAdd);

  if (toAdd.length || edgesToAdd.length) {
    gbApplyPhysicianWeighting();
    gbCy.layout({ name: "cose", animate: false, fit: true, padding: 24 }).run();
  }
  document.getElementById("gb-empty-hint").hidden = gbVisibleIds.size > 0;
}

function gbExpandNode(nodeId) {
  const edges = gbIndex.edgesByNode.get(nodeId) || [];
  const neighborIds = new Set();
  for (const e of edges) {
    const { source, target } = e.data;
    neighborIds.add(source === nodeId ? target : source);
  }
  gbAddNodes([...neighborIds]);
}

function gbSearch(query) {
  const status = document.getElementById("gb-search-status");
  const q = (query || "").trim();
  if (gbCy) gbCy.nodes().removeClass("gb-search-hit");
  if (!q) { status.textContent = ""; return; }
  const matches = gbGraphData.graph.nodes.filter((n) => (n.data.label || "").includes(q));
  if (!matches.length) {
    status.textContent = "未找到匹配节点";
    return;
  }
  status.textContent = `找到 ${matches.length} 个匹配节点`;
  gbAddNodes(matches.map((n) => n.data.id));
  const matchedIds = new Set(matches.map((n) => n.data.id));
  const eles = gbCy.nodes().filter((ele) => matchedIds.has(ele.id()));
  eles.addClass("gb-search-hit");
  gbCy.animate({ fit: { eles, padding: 40 } }, { duration: 300 });
}

function gbToggleLayer() {
  gbShowCaseLayer = !gbShowCaseLayer;
  document.getElementById("gb-layer-toggle").textContent =
    gbShowCaseLayer ? "切换到国标层" : "切换到医案层";
  if (!gbShowCaseLayer) {
    const caseIds = [...gbVisibleIds].filter((id) => gbIndex.nodeById.get(id)?.data.node_type === "case");
    for (const id of caseIds) {
      gbCy.getElementById(id).remove();
      gbVisibleIds.delete(id);
    }
    return;
  }
  const toReveal = [];
  for (const id of gbVisibleIds) {
    for (const e of gbIndex.edgesByNode.get(id) || []) {
      const other = e.data.source === id ? e.data.target : e.data.source;
      if (gbIndex.nodeById.get(other)?.data.node_type === "case") toReveal.push(other);
    }
  }
  gbAddNodes(toReveal);
}

function gbResetView() {
  ensureGraphBrowserCanvas();
  gbCy.elements().remove();
  gbVisibleIds = new Set();
  document.getElementById("gb-search").value = "";
  document.getElementById("gb-search-status").textContent = "";
  const syndromeIds = gbGraphData.graph.nodes
    .filter((n) => n.data.node_type === "syndrome")
    .map((n) => n.data.id);
  document.getElementById("gb-empty-hint").textContent = "点击节点展开关联的证素/症状，或用上方搜索框定位";
  gbAddNodes(syndromeIds);
}

function renderGbLambda1Note(note) {
  // 原样展示后端 lambda1_note() 算出来的文字，前端不改写、不精简一个字——
  // 这段话是这个项目的一个真实发现（要么图里压根没挂医案，要么医案证型
  // 体系跟国标对不上），弱化或省略它比图上有 bug 更严重。
  document.getElementById("gb-lambda1-note").textContent = note || "";
}

function renderGbStats(stats) {
  const el = document.getElementById("gb-stats");
  if (!stats) { el.textContent = ""; return; }
  const fmt = (obj) => Object.entries(obj || {}).map(([k, v]) => `${k} ${v}`).join("　");
  el.textContent = `节点：${fmt(stats.node_type_counts)}　|　边：${fmt(stats.edge_type_counts)}`;
}

function populateGbPhysicianSelect(physicians) {
  const sel = document.getElementById("gb-physician-select");
  sel.innerHTML = "";
  for (const p of physicians || []) {
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.name;
    sel.appendChild(opt);
  }
  gbCurrentPhysician = (physicians && physicians[0] && physicians[0].id) || null;
  if (gbCurrentPhysician) sel.value = gbCurrentPhysician;
}

async function loadGraphBrowserData() {
  const hint = document.getElementById("gb-empty-hint");
  const errBox = document.getElementById("gb-error-box");
  hint.hidden = false;
  hint.textContent = "加载中…";
  errBox.classList.remove("show");
  try {
    const resp = await fetch("/api/graph");
    if (!resp.ok) {
      const text = await resp.text();
      throw new Error(`服务返回错误（HTTP ${resp.status}）：${text}`);
    }
    gbGraphData = await resp.json();
    gbBuildIndex();
    renderGbLambda1Note(gbGraphData.lambda1_note);
    renderGbStats(gbGraphData.stats);
    populateGbPhysicianSelect(gbGraphData.physicians);
    // 医案层是空的（has_case_layer=false）就不显示这个按钮，不是显示一个
    // 点了没反应的——这个 sandbox 里 data/graph.json 只有国标层数据，
    // AutoDL 上跑过 attach_cases 之后 has_case_layer 会是 true，按钮才出现。
    document.getElementById("gb-layer-toggle").hidden = !gbGraphData.has_case_layer;
    gbResetView();
  } catch (err) {
    hint.hidden = true;
    errBox.textContent = `图谱加载失败：${err.message || err}`;
    errBox.classList.add("show");
  }
}

function switchTab(tab) {
  const toConsult = tab === "consult";
  document.getElementById("tab-btn-consult").classList.toggle("active", toConsult);
  document.getElementById("tab-btn-graph-browser").classList.toggle("active", !toConsult);
  document.getElementById("tab-consult").hidden = !toConsult;
  document.getElementById("tab-graph-browser").hidden = toConsult;
  if (!toConsult && !gbGraphData) loadGraphBrowserData();
}

document.getElementById("tab-btn-consult").addEventListener("click", () => switchTab("consult"));
document.getElementById("tab-btn-graph-browser").addEventListener("click", () => switchTab("graph-browser"));
document.getElementById("gb-search-btn").addEventListener("click", () => gbSearch(document.getElementById("gb-search").value));
document.getElementById("gb-search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") gbSearch(e.target.value);
});
document.getElementById("gb-physician-select").addEventListener("change", (e) => {
  gbCurrentPhysician = e.target.value;
  gbApplyPhysicianWeighting();
});
document.getElementById("gb-layer-toggle").addEventListener("click", gbToggleLayer);
document.getElementById("gb-reset-btn").addEventListener("click", gbResetView);

function sleep(ms) {
  return new Promise((r) => setTimeout(r, ms));
}

let growToken = 0; // 每次新的生长自增，旧的循环据此提前退出

async function growGraph(graph, { animate = true } = {}) {
  ensureCanvas();
  // 配色随医家变化（physicians.py 是唯一源），每次重新应用样式表
  cy.style(buildStylesheet());
  cy.elements().remove();

  const positions = computeLayout(graph.nodes, graph.edges);
  const nodesByLayer = { 0: [], 1: [], 2: [], 3: [], 4: [] };
  for (const n of graph.nodes) nodesByLayer[n.data.layer].push(n);

  const myToken = ++growToken;
  const addNode = (n) =>
    cy.add({ group: "nodes", data: n.data, position: positions[n.data.id] });

  // 某一层的节点加完之后，把两端都已存在的边补上。
  // grow=true 时用 line-dash-offset 做"生长"：先把边整条画成一段虚线
  // （dash 长度 = 边长），offset 从边长动到 0，看上去就是从起点延伸到终点，
  // 动完再切回 solid。Cytoscape 的元素不是 DOM，只能用 cy.animate()，
  // CSS transition 对它无效。
  const addReadyEdges = (grow = false) => {
    const present = new Set(cy.nodes().map((n) => n.id()));
    const added = [];
    for (const e of graph.edges) {
      const { source, target } = e.data;
      if (!present.has(source) || !present.has(target)) continue;
      if (cy.edges(`[source = "${source}"][target = "${target}"]`).length) continue;
      added.push(cy.add({ group: "edges", data: e.data }));
    }
    if (!grow) return added;

    for (const el of added) {
      let len = 260;
      try {
        const s = el.source().position();
        const t = el.target().position();
        len = Math.max(40, Math.hypot(t.x - s.x, t.y - s.y));
      } catch (_) {}
      el.style({
        "line-style": "dashed",
        "line-dash-pattern": [len, len],
        "line-dash-offset": len,
        "target-arrow-shape": "none",
      });
      el.animate(
        { style: { "line-dash-offset": 0 } },
        {
          duration: 420,
          easing: "ease-out",
          complete: () => {
            el.removeStyle("line-style line-dash-pattern line-dash-offset target-arrow-shape");
          },
        }
      );
    }
    return added;
  };

  if (!animate) {
    // 顺序很重要：layer 3（方剂，compound 父节点）必须先加完，layer 4
    // （药材，compound 子节点）才能加——cytoscape 的子节点靠 data.parent
    // 引用父节点 id，父节点不存在时子节点加不上或渲染不出 compound 关系。
    for (const layer of [0, 1, 2, 3, 4]) nodesByLayer[layer].forEach(addNode);
    addReadyEdges();
    cy.fit(undefined, 24);
    return;
  }

  const STAGGER = { 0: 60, 1: 50, 2: 90, 3: 60, 4: 20 };
  for (const layer of [0, 1, 2, 3, 4]) {
    for (const n of nodesByLayer[layer]) {
      if (myToken !== growToken) return; // 被新一次生长取代，停掉旧循环
      const el = addNode(n);
      el.style("opacity", 0);
      el.animate({ style: { opacity: 1 } }, { duration: 240, easing: "ease-out" });
      await sleep(STAGGER[layer]);
    }
    if (myToken !== growToken) return;
    addReadyEdges(true);
    await sleep(360); // 让边基本长完再进下一层，否则层层重叠看不清
  }
  cy.fit(undefined, 24);
}

// 保留旧名，默认不带动画——改动画开关只在一处，调用方不用改。
function renderGraph(graph) {
  return growGraph(graph, { animate: true });
}

function replayGraph() {
  if (lastGraph) growGraph(lastGraph, { animate: true });
}

function skipAnimation() {
  if (lastGraph) growGraph(lastGraph, { animate: false });
}

let lastGraph = null;

// 节点 id -> 该节点对应的证据。图上只有 id 和 label，医家的 refs 在
// data.results 里，点击时要能反查，所以每次响应回来先建一张索引。
let EVIDENCE = {};

function buildEvidenceIndex(data) {
  EVIDENCE = {};
  const put = (id, payload) => {
    if (!EVIDENCE[id]) EVIDENCE[id] = { title: payload.title, sections: [] };
    EVIDENCE[id].sections.push(payload);
  };

  for (const r of data.results || []) {
    const s2 = r.s2 || {};
    const s3 = r.s3 || {};

    put(`syn::${r.physician}`, {
      title: `${s3.syndrome || "证型"}　·　${r.physician_name}`,
      physician_name: r.physician_name,
      color: r.color,
      reasoning: s3.reasoning,
      note: s3.note,
      treatment: s3.treatment_principle,
      formula: s3.formula,
      refs: r.refs || [],
      // 侧栏只把模型真正引用了的医案标成"引用"；检索到但没引用的单独列，
      // 否则幻觉引用在卡片上有红标、侧栏里却把全部检索结果当成结论的依据
      cited: new Set(s3.cited_case_ids || []),
      hallucinated: r.hallucinated || [],
      no_reference_cases: !!r.no_reference_cases,
      react_trace: r.react_trace || null,
    });

    for (const hit of s2.elements || []) {
      put(`elem::${hit.element}`, {
        title: `证素　${hit.element}`,
        physician_name: r.physician_name,
        color: r.color,
        element_kind: hit.kind === "location" ? "病位" : "病性",
        confidence: hit.confidence,
        supporting: hit.supporting_symptoms || [],
      });
      for (const sym of hit.supporting_symptoms || []) {
        put(`sym::${sym}`, {
          title: `症状　${sym}`,
          physician_name: r.physician_name,
          color: r.color,
          explained_by: hit.element,
          confidence: hit.confidence,
        });
      }
    }

    // M5：方剂(layer 3)/药材(layer 4) 都要建反查索引——层 3 从"用药"改成
    // "方剂"之后不再有旧式 herb::{physician}::{herb} 这种节点，图上出现的
    // 是每个候选方各一个 formula:: 节点、各自带自己的 herb:: 子节点，全部
    // 候选方都建索引（不是只建 selected 那个），否则点未选中的候选方节点
    // 侧栏是空的。
    (s3.formula_candidates || []).forEach((cand, i) => {
      put(`formula::${r.physician}::${cand.name}`, {
        title: `${cand.name}　·　${r.physician_name}`,
        physician_name: r.physician_name,
        color: r.color,
        source: cand.source,
        base_formula: cand.base_formula,
        confidence: cand.confidence,
        rationale: cand.rationale,
        selected: i === s3.selected,
        doses_count: cand.doses_count,
        usage: cand.usage,
        safety: cand.safety || null,
      });
      for (const item of cand.herb_items || []) {
        put(`herb::${r.physician}::${cand.name}::${item.name}`, {
          title: `${item.name}　·　${cand.name}`,
          physician_name: r.physician_name,
          color: r.color,
          formula: cand.name,
          dose: item.dose,
          dose_unit: item.dose_unit,
          processing: item.processing,
          decoction: item.decoction,
          role: item.role,
          function_in_formula: item.function_in_formula,
          refs: (r.refs || []).filter((x) => (x.herbs || []).some((h) => h.includes(item.name) || item.name.includes(h))),
        });
      }
    });
  }
}

function evidenceSectionHtml(s) {
  const rows = [];
  if (s.element_kind) rows.push(`<div class="meta">${s.element_kind}　置信度 ${s.confidence}</div>`);
  if (s.explained_by) rows.push(`<div class="meta">由证素「${escapeHtml(s.explained_by)}」解释　置信度 ${s.confidence}</div>`);
  if (s.supporting && s.supporting.length) {
    rows.push(`<div class="label">支撑症状</div><div>${escapeHtml(s.supporting.join("、"))}</div>`);
  }
  if (s.treatment) rows.push(`<div class="label">治法</div><div>${escapeHtml(s.treatment)}</div>`);
  if (s.formula) rows.push(`<div class="label">方剂</div><div>${escapeHtml(s.formula)}</div>`);

  // M5：方剂节点的候选方元信息（source/confidence/rationale……）。只有
  // formula:: 节点的 payload 才会带 source 字段，症状/证素/证型的 payload
  // 里没有这个键，条件判断天然把两类节点分开，不用额外传节点类型标记。
  if (s.source) {
    const srcLabel = { classic: "经典方", modified: "加减方", composed: "自拟方" }[s.source] || s.source;
    const metaParts = [
      escapeHtml(srcLabel),
      s.base_formula ? "原方：" + escapeHtml(s.base_formula) : "",
      "置信度 " + escapeHtml(s.confidence || ""),
      s.selected ? "★已选" : "",
    ].filter(Boolean);
    rows.push(`<div class="meta">${metaParts.join("　")}</div>`);
  }
  if (s.rationale) rows.push(`<div class="label">立方思路</div><div>${escapeHtml(s.rationale)}</div>`);
  if (s.doses_count || s.usage) {
    const usageParts = [
      s.doses_count ? `${s.doses_count} 剂` : "",
      s.usage ? escapeHtml(s.usage) : "",
    ].filter(Boolean);
    rows.push(`<div class="meta">${usageParts.join("　")}</div>`);
  }
  if (s.safety) {
    const sf = s.safety;
    const blocking = [];
    if (sf.incompatible && sf.incompatible.length) {
      blocking.push("配伍禁忌：" + sf.incompatible.map((p) => p.join("与")).join("；"));
    }
    if (sf.dose_violations && sf.dose_violations.length) {
      blocking.push("剂量超限：" + sf.dose_violations.map((v) => `${v.herb} ${v.dose}${v.unit}`).join("；"));
    }
    const warn = [];
    if (sf.thermal_warning) warn.push(sf.thermal_warning);
    if (sf.decoction_missing && sf.decoction_missing.length) warn.push("煎法缺失：" + sf.decoction_missing.join("、"));
    if (sf.toxic_herbs && sf.toxic_herbs.length) warn.push("含毒性药材：" + sf.toxic_herbs.join("、"));
    if (blocking.length) rows.push(`<div class="label">⚠ 安全拦截</div><div class="meta">${escapeHtml(blocking.join("；"))}</div>`);
    if (warn.length) rows.push(`<div class="label">安全提示</div><div class="meta">${escapeHtml(warn.join("；"))}</div>`);
  }

  // M5：药材节点的剂量/炮制/煎法/君臣佐使/方中作用。
  if (s.dose != null || s.processing || s.decoction || s.role) {
    const doseParts = [
      s.dose != null ? `剂量 ${s.dose}${escapeHtml(s.dose_unit || "")}` : "",
      s.processing ? "炮制：" + escapeHtml(s.processing) : "",
      s.decoction ? "煎法：" + escapeHtml(s.decoction) : "",
      s.role ? escapeHtml(s.role) + "药" : "",
    ].filter(Boolean);
    rows.push(`<div class="meta">${doseParts.join("　")}</div>`);
  }
  if (s.function_in_formula) rows.push(`<div class="label">方中作用</div><div>${escapeHtml(s.function_in_formula)}</div>`);

  if (s.reasoning) rows.push(`<div class="label">推理过程</div><div>${escapeHtml(s.reasoning)}</div>`);
  if (s.note) rows.push(`<div class="label">备注</div><div>${escapeHtml(s.note)}</div>`);

  if (s.no_reference_cases) {
    rows.push(`<div class="label">引用医案</div><div class="meta">未检索到相关医案（相似度均低于阈值），本结论没有医案支撑。</div>`);
  }
  if (s.hallucinated && s.hallucinated.length) {
    rows.push(`<div class="label">⚠ 幻觉引用</div><div class="meta">模型引用了检索结果之外的 id：${escapeHtml(s.hallucinated.join("、"))}</div>`);
  }
  if (s.react_trace && s.react_trace.steps && s.react_trace.steps.length) {
    const steps = s.react_trace.steps.map((st) =>
      `<div class="meta">第${st.step}步 ${escapeHtml(st.action)}${st.note ? "（" + escapeHtml(st.note) + "）" : ""}：${escapeHtml((st.thought || "").slice(0, 80))}</div>`).join("");
    rows.push(`<div class="label">取证过程（${escapeHtml(s.react_trace.terminated_by)}，${s.react_trace.llm_calls} 次调用）</div>${steps}`);
  }
  if (s.refs && s.refs.length) {
    const citedRefs = s.refs.filter((r) => s.cited && s.cited.has(r.case_id));
    const otherRefs = s.refs.filter((r) => !(s.cited && s.cited.has(r.case_id)));
    const caseHtml = (r, i) => {
        const raw = r.excerpt || "";
        const long = raw.length > 110;
        return `<div class="ev-case">
          <div class="cid">${escapeHtml(r.case_id)}</div>
          <div class="meta">${r.visit_label}　相似度 ${r.score}${r.syndrome ? "　证：" + escapeHtml(r.syndrome) : ""}</div>
          <div>${escapeHtml((r.symptoms || []).slice(0, 5).join("；"))}</div>
          ${raw ? `<div class="ev-raw" id="raw-${i}-${Math.random().toString(36).slice(2, 7)}">${escapeHtml(raw)}</div>
            ${long ? '<span class="ev-more" onclick="this.previousElementSibling.classList.toggle(\'expanded\'); this.textContent = this.textContent === \'展开全文\' ? \'收起\' : \'展开全文\';">展开全文</span>' : ""}` : ""}
        </div>`;
      };
    if (s.cited) {
      if (citedRefs.length) rows.push(`<div class="label">引用医案（${citedRefs.length}）</div>${citedRefs.map(caseHtml).join("")}`);
      if (otherRefs.length) rows.push(`<div class="label">检索到但未引用（${otherRefs.length}）</div>${otherRefs.map(caseHtml).join("")}`);
    } else {
      rows.push(`<div class="label">相关医案（${s.refs.length}）</div>${s.refs.map(caseHtml).join("")}`);
    }
  }

  return `<div class="ev-sec">
    <div style="font-weight:600;color:${s.color || "#333"};margin-bottom:6px;">${escapeHtml(s.physician_name)}</div>
    ${rows.join("")}
  </div>`;
}

function openEvidence(nodeId) {
  const e = EVIDENCE[nodeId];
  if (!e) return;
  document.getElementById("evidence-title").textContent = e.title;
  document.getElementById("evidence-body").innerHTML = e.sections.map(evidenceSectionHtml).join("");
  document.getElementById("evidence-panel").classList.add("open");
}

function closeEvidence() {
  document.getElementById("evidence-panel").classList.remove("open");
}

function renderDivergence(divergence) {
  const banner = document.getElementById("divergence-banner");
  if (divergence && divergence.herb_jaccard !== null && divergence.herb_jaccard !== undefined) {
    const j = divergence.herb_jaccard;
    const eps = divergence.epsilon_online;
    const shared = divergence.shared_herbs || [];
    const tp = divergence.treatment_principle_same ? "治法一致" : "治法不同";
    // 三档判定，按 offline/estimate_epsilon.py 产出的噪声地板分档：
    //   没测过 ε —— 退回旧的三段式粗判，并如实标注"未测噪声地板"
    //   jaccard <= ε —— 差异在同一设定重复跑本来就会有的抖动范围内，不算分歧
    //   ε < jaccard —— 按原来 0.3/0.7 两档粗分程度
    let level, epsNote;
    if (eps === null || eps === undefined) {
      level = j <= 0.3 ? "用药高度重合" : j <= 0.7 ? "用药部分重合" : "用药基本不重合";
      epsNote = "；对照基准 ε 尚未估算，此数暂无参照";
    } else if (j <= eps) {
      level = "用药差异在模型抖动范围内，不构成分歧";
      epsNote = `；ε=${eps}`;
    } else {
      level = j <= 0.5 ? "用药部分重合" : "用药基本不重合";
      epsNote = `；ε=${eps}（已超出噪声范围）`;
    }
    const sharedText = shared.length ? `，共用 ${shared.join("、")}` : "";
    banner.textContent = `${tp}；${level}（药物 Jaccard 距离 ${j}${sharedText}${epsNote}）`;
    banner.classList.add("show");
  } else if (divergence && divergence.same === false) {
    banner.textContent = "两位医家的辨证结论不同（按证型名称精确比对，为粗略判定）";
    banner.classList.add("show");
  } else {
    banner.classList.remove("show");
  }
}

function refListHtml(refs) {
  if (!refs || refs.length === 0) {
    return '<div class="ref-item">（无相关医案，相似度均低于阈值）</div>';
  }
  return refs
    .map((r) => {
      const syn = r.syndrome ? `　证：${escapeHtml(r.syndrome)}` : "";
      const sym = (r.symptoms || []).slice(0, 4).join("；");
      const ex = r.excerpt
        ? `<div class="ref-excerpt">${escapeHtml(r.excerpt.slice(0, 120))}${r.excerpt.length > 120 ? "…" : ""}</div>`
        : "";
      return `<div class="ref-item">
        <b>${escapeHtml(r.case_id)}</b>　${r.visit_label}　相似度 ${r.score}${syn}
        <div class="ref-sym">${escapeHtml(sym)}</div>
        ${ex}
      </div>`;
    })
    .join("");
}

function cardHtml(result) {
  const color = PHYSICIAN_COLORS[result.physician] || "#333";
  const s3 = result.s3;
  const hallucinationHtml = result.hallucinated && result.hallucinated.length > 0
    ? `<div class="hallucination-warning">⚠ 检测到可能的幻觉引用：模型引用了检索结果之外的医案 id（${escapeHtml(result.hallucinated.join("、"))}），请勿采信该结论中的引用。</div>`
    : "";

  // X2：incompatible 非空说明重开一次之后仍有禁忌，这时红标签必须显示——
  // 它代表"系统尝试修正但没修好"，比没检查更需要让人看到。
  const so = result.safety_output || {};
  const incompatibleHtml = so.incompatible && so.incompatible.length > 0
    ? `<div class="safety-incompatible">⚠ 配伍禁忌：${so.incompatible.map(p => `${escapeHtml(p[0])} 反/畏 ${escapeHtml(p[1])}`).join("；")}</div>`
    : "";
  const thermalHtml = so.thermal_warning
    ? `<div class="safety-thermal">⚠ ${escapeHtml(so.thermal_warning)}</div>`
    : "";
  const revisedHtml = so.revised
    ? `<div class="safety-revised">已因配伍禁忌自动重开一次方</div>`
    : "";
  const westernHtml = westernDrugsHtml(s3);
  const noRefHtml = result.no_reference_cases
    ? `<div class="safety-thermal">⚠ 未检索到相关医案（相似度均低于阈值）：本结论没有医案支撑，仅供参考</div>`
    : "";
  const rt = result.react_trace;
  const reactHtml = rt && rt.steps && rt.steps.length
    ? `<div class="label">取证过程（${escapeHtml(rt.terminated_by)}，${rt.llm_calls} 次调用）</div>` +
      rt.steps.map((st) => `<div>第${st.step}步 ${escapeHtml(st.action)}${st.note ? "（" + escapeHtml(st.note) + "）" : ""}：${escapeHtml((st.thought || "").slice(0, 100))}</div>`).join("") +
      (rt.pending_question ? `<div>追问患者：${escapeHtml(rt.pending_question)}${rt.pending_answer ? "　答：" + escapeHtml(rt.pending_answer) : "（未获回答）"}</div>` : "")
    : "";

  return `
    <div class="card">
      <h2 style="color:${color}">${result.physician_name}</h2>
      <div class="field"><b>证型</b>${escapeHtml(s3.syndrome)}</div>
      <div class="field"><b>治法</b>${escapeHtml(s3.treatment_principle)}</div>
      <div class="field"><b>方剂</b>${escapeHtml(s3.formula || "（未明确）")}</div>
      <div class="field"><b>用药</b>${escapeHtml((s3.herbs || []).join("、") || "（无）")}</div>
      ${westernHtml}
      ${incompatibleHtml}
      ${thermalHtml}
      ${revisedHtml}
      ${noRefHtml}
      ${hallucinationHtml}
      <details>
        <summary>推理过程与引用详情</summary>
        <div class="detail-block">
          <div class="label">推理过程</div>
          <div>${escapeHtml(s3.reasoning)}</div>
          <div class="label">引用医案 id</div>
          <div>${escapeHtml((s3.cited_case_ids || []).join("、") || "（无）")}</div>
          <div class="label">检索结果与相似度</div>
          ${refListHtml(result.refs)}
          ${reactHtml}
          ${s3.note ? `<div class="label">备注</div><div>${escapeHtml(s3.note)}</div>` : ""}
        </div>
      </details>
    </div>
  `;
}

// 「参西用药」栏。张锡纯「衷中参西」会在方里用阿斯匹林这类西药，是他最有辨识度的
// 特征，单独一栏展示；叶天士/吴鞠通两本书实测一个西药词都没有，他们的 western_drugs
// 恒为空，此时返回空串——不显示一个空栏。提成顶层纯函数是为了能被测试直接调用
// （tests/test_web_render.py 用 node 跑的就是这里这份代码，不是另抄一份）。
function westernDrugsHtml(s3) {
  const drugs = (s3 && s3.western_drugs) || [];
  if (!drugs.length) return "";
  return `<div class="western-drugs"><b>参西用药</b>　${escapeHtml(drugs.join("、"))}</div>`;
}

function escapeHtml(str) {
  // 引号也转：这个函数的输出偶尔会被放进属性值里（title="..."），只转尖括号
  // 的话一个带引号的医案 id 就能从属性里逃出来。
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function renderResults(results) {
  document.getElementById("results").innerHTML = results.map(cardHtml).join("");
}

// 被拦截/信息不足的请求也要把上一次正常问诊留下的东西清掉：残差提示、页脚、
// 证据索引、上一张图。否则「重播」会重绘上一位患者的图。
function resetSecondaryPanels() {
  lastGraph = null;
  EVIDENCE = {};
  closeEvidence();
  hideTooltip();
  for (const id of ["residual-note", "graph-note", "followup-note"]) {
    const el = document.getElementById(id);
    if (el) { el.textContent = ""; el.style.display = "none"; }
  }
  renderSafetyFlag(null);
  const footer = document.getElementById("manifest-footer");
  if (footer) footer.textContent = "";
}

// G3 追问记录。HTTP 路径上现在没有提问渠道（api_consult 不传 ask_fn），所以正常情况
// 下 followup.stopped_by 是 no_answer、什么都不显示；一旦接上 SSE/表单式追问，
// 这里就会把问答和否认的症状渲染出来。
function renderFollowup(followup) {
  let el = document.getElementById("followup-note");
  if (!el) {
    el = document.createElement("div");
    el.id = "followup-note";
    el.className = "residual-note";
    const results = document.getElementById("results");
    results.parentElement.insertBefore(el, results);
  }
  if (!followup || !followup.history || followup.history.length === 0) {
    el.style.display = "none";
    return;
  }
  const qa = followup.history.map((h) =>
    `<div>问：${escapeHtml(h.question)}　答：${escapeHtml(h.answer)}${h.safety_hit ? "　<b>⚠ 触发安全否决</b>" : ""}</div>`).join("");
  const denied = (followup.denied || []).length ? `<div>患者明确否认：${escapeHtml(followup.denied.join("、"))}</div>` : "";
  el.innerHTML = `<div><b>追问（${followup.rounds} 轮，${escapeHtml(followup.stopped_by)}）</b></div>${qa}${denied}`;
  el.style.display = "block";
}

function showError(message) {
  const box = document.getElementById("error-box");
  box.textContent = message;
  box.classList.add("show");
}

function describeSafetyFlag(flag) {
  // safety_flag 非空 = 服务端开着 EVAL_MODE，这条主诉本该在辨证前被拦下、
  // 不产出任何方药，但评测模式让它跑完了。README 说"不要在对外演示的机器上
  // 打开"，可是之前页面上完全看不出来它开着——结果照常显示、方药照常开。
  // 返回 null 表示不需要横幅。
  if (!flag) return null;
  return `⚠ 评测模式（EVAL_MODE）已开启：这条主诉命中了安全否决（${flag}），正常情况下会在辨证前被拦截、不产出任何方药。下面的结果只用于评测，不要用于演示或作为参考。`;
}

function renderSafetyFlag(flag) {
  const box = document.getElementById("safety-flag-note");
  if (!box) return;
  const text = describeSafetyFlag(flag);
  box.textContent = text || "";
  box.classList.toggle("show", !!text);
}

function clearError() {
  const box = document.getElementById("error-box");
  box.classList.remove("show");
  box.textContent = "";
}

// data 的形状是 api/main.py::_consult_response() 的返回值——不管是走
// /api/consult 的普通响应体，还是走 /api/consult/stream 的 done 事件，
// 两条路径共用同一个后端函数拼出这份 JSON，这里也只用一份渲染逻辑接。
// 检索模式跟着请求走：空值表示"用服务端默认"，这时候整个字段都不带，
// 而不是传一个空字符串（空字符串不在 ALLOWED_MODES 里，会被当成非法模式名）。
function buildConsultRequestBody(complaint) {
  const body = { complaint };
  const sel = document.getElementById("retriever-mode");
  const mode = sel ? sel.value : "";
  if (mode) body.retriever_mode = mode;
  return body;
}

function renderConsultResult(data) {
  resetSecondaryPanels();
  if (data.rejected) {
    showError(`⚠ ${data.reject_reason}`);
    renderDivergence(null);
    renderResults([]);
    renderFollowup(data.followup);
    renderGraph(data.graph);
    return;
  }
  if (data.retrieval_error) {
    // 选的检索模式这台机器上跑不起来。这是服务端能力问题，不是"你给的信息不够"，
    // 所以跟 insufficient 分开显示；后端也没有偷偷换个模式跑完再假装成功，
    // 这里如实把原因显示出来（graph 模式的静默降级会让 E8 消融失去意义）。
    showError(`⚠ ${data.retrieval_error}`);
    renderDivergence(null);
    renderResults([]);
    renderFollowup(data.followup);
    renderGraph(data.graph);
    return;
  }
  if (data.insufficient) {
    // 信息不足不是错误：系统承认没法有依据地辨证，要把补充信息的提示原样给用户
    showError(`ℹ ${data.insufficient_reason || "现有症状不足以推断证素，请补充更多信息。"}`);
    renderDivergence(null);
    renderResults([]);
    renderFollowup(data.followup);
    renderGraph(data.graph);
    return;
  }
  renderSafetyFlag(data.safety_flag);
  PHYSICIAN_COLORS = {};
  PHYSICIAN_NAMES = {};
  for (const r of data.results) {
    if (r.color) PHYSICIAN_COLORS[r.physician] = r.color;
    PHYSICIAN_NAMES[r.physician] = r.physician_name;
  }
  const m = data.manifest;
  document.getElementById("manifest-footer").textContent = m
    ? `${m.model}　prompt ${m.prompt_version}　语料 ${m.cases_sha256 || "?"}　${m.llm_calls} 次调用　${(m.elapsed_ms / 1000).toFixed(1)}s`
    : "";
  buildEvidenceIndex(data);
  const res = data.residual;
  const rnote = document.getElementById("residual-note");
  if (rnote) {
    if (res && res.triggered) {
      const before = Math.round(res.coverage_before * 100);
      const after = Math.round(res.coverage_after * 100);
      const gained = (res.newly_explained || []).join("、");
      rnote.innerHTML = `残差辨证：初轮解释率 ${before}% → ${after}%` +
        (gained ? `，补充解释「${escapeHtml(gained)}」` : "") +
        (res.still_unexplained && res.still_unexplained.length
          ? `；仍未解释「${escapeHtml(res.still_unexplained.join("、"))}」` : "");
      rnote.style.display = "block";
    } else {
      rnote.style.display = "none";
    }
  }
  lastGraph = data.graph;
  const dropped = data.graph.dropped_edges || 0;
  const note = document.getElementById("graph-note");
  if (dropped > 0) {
    note.textContent = `有 ${dropped} 条推理连线因症状表述不一致未能显示`;
    note.style.display = "block";
  } else {
    note.style.display = "none";
  }
  renderDivergence(data.divergence);
  renderResults(data.results);
  renderFollowup(data.followup);
  renderGraph(data.graph);
}

function appendProgress(line) {
  const log = document.getElementById("progress-log");
  log.classList.add("show");
  log.textContent += (log.textContent ? "\n" : "") + line;
  log.scrollTop = log.scrollHeight;
}

function clearProgress() {
  const log = document.getElementById("progress-log");
  log.textContent = "";
  log.classList.remove("show");
}

let currentStreamId = null;

function showNeedInput(question) {
  document.getElementById("need-input-question").textContent = `❓ ${question}`;
  const input = document.getElementById("need-input-answer");
  input.value = "";
  document.getElementById("need-input-box").classList.add("show");
  input.focus();
}

function hideNeedInput() {
  document.getElementById("need-input-box").classList.remove("show");
}

async function submitNeedInputAnswer() {
  const input = document.getElementById("need-input-answer");
  const answer = input.value.trim();
  // 没有 currentStreamId 说明流已经结束（比如用户手滑点了两下）——这时候
  // 提交答案没有地方能接住，后端会回 404，不如干脆不发这个请求。
  if (!answer || !currentStreamId) return;
  hideNeedInput();
  try {
    const resp = await fetch(`/api/consult/stream/${currentStreamId}/answer`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answer }),
    });
    if (!resp.ok) {
      const text = await resp.text();
      throw new Error(`回答提交失败（HTTP ${resp.status}）：${text}`);
    }
    // 不在这里手动往 progress-log 加"已回答"——服务端会在真正收到、真正
    // 让 consult() 里的 ask_fn 返回之后回发一条 followup_answered 事件，
    // 那条才是唯一真相；这里手动加一条的话，等那条事件到达时就会重复一遍。
  } catch (err) {
    showError(`回答提交失败：${err.message || err}`);
  }
}

// 把一条 SSE 进度事件翻成人看得懂的一行日志。事件名和数据形状是
// core/chain.py::consult() 的 on_step 回调定义的契约——那边新增一种事件，
// 这里要跟着加一个 case，不加也不会报错，只是进度条上少一行，不算严重故障，
// 所以没有钉一条"事件名必须穷举"的断言，交给人工核对事件名对不对得上。
function describeProgressEvent(name, data) {
  switch (name) {
    case "s1_done":
      return `① 症状标准化：${(data.symptoms || []).join("、")}`;
    case "s2_done":
      return `② 证素推断${data.after_followup ? "（追问后重跑）" : ""}：` +
        ((data.elements || []).map((e) => e.element).join("、") || "（未推出证素）");
    case "followup_done":
      if (data.stopped_by === "no_answer") return "③ 追问：无提问渠道，跳过";
      if (data.stopped_by === "fast_mode") return "③ 追问：FAST_MODE 已跳过";
      return `③ 追问结束（${data.rounds} 轮，${data.stopped_by}）`;
    case "residual_done":
      return `④ 残差辨证：补充解释「${(data.newly_explained || []).join("、") || "无"}」`;
    case "physician_start":
      return `▶ ${data.physician_name} 开始辨证…`;
    case "react_step":
      return `　${data.physician_name} 取证第 ${data.step} 步：${data.action}`;
    case "s3_start":
      return `　${data.physician_name} 正在拟定证型与方药…`;
    case "physician_done":
      return `✓ ${data.physician_name} 完成：${data.syndrome}`;
    case "followup_answered":
      return `　已回答「${data.question}」：${data.answer}`;
    default:
      return null; // stream_id / need_input / done / error 各自单独处理，不进日志
  }
}

// 手写 SSE 帧解析而不是用浏览器原生 EventSource：EventSource 只能发 GET，
// 这里要在打开流的同一个请求里带上 complaint（POST body），只能自己用
// fetch + ReadableStream 读。SSE 帧格式是"若干 field: value 行 + 一个空行"，
// 这里只用到 event/data 两个字段。
async function readSSE(response, onEvent) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buf = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) !== -1) {
      const frame = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      let eventName = "message";
      const dataLines = [];
      for (const line of frame.split("\n")) {
        if (line.startsWith("event: ")) eventName = line.slice(7);
        else if (line.startsWith("data: ")) dataLines.push(line.slice(6));
      }
      if (dataLines.length) onEvent(eventName, JSON.parse(dataLines.join("\n")));
    }
  }
}

async function submitConsult() {
  const complaint = document.getElementById("complaint").value.trim();
  if (!complaint) {
    showError("请先输入患者主诉。");
    return;
  }

  const btn = document.getElementById("submit-btn");
  const status = document.getElementById("status-text");
  btn.disabled = true;
  btn.textContent = "推理中…";
  status.textContent = "";
  clearError();
  clearProgress();
  hideNeedInput();
  currentStreamId = null;

  try {
    const resp = await fetch("/api/consult/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // 检索模式跟着这一次请求走，不去调什么"服务端设置"接口——服务端的
      // RETRIEVER_MODE 是进程级的，改它会影响同时在跑的别人的请求。
      // 空字符串 = 用默认，这时候不带这个字段（不是传 ""，那是个非法模式名）。
      body: JSON.stringify(buildConsultRequestBody(complaint)),
    });
    if (!resp.ok) {
      const text = await resp.text();
      throw new Error(`服务返回错误（HTTP ${resp.status}）：${text}`);
    }

    let doneData = null;
    let errorDetail = null;
    await readSSE(resp, (name, data) => {
      if (name === "stream_id") {
        currentStreamId = data.stream_id;
      } else if (name === "need_input") {
        showNeedInput(data.question);
      } else if (name === "error") {
        errorDetail = data.detail;
      } else if (name === "done") {
        doneData = data;
      } else {
        const line = describeProgressEvent(name, data);
        if (line) appendProgress(line);
        if (name === "followup_answered") hideNeedInput();
      }
    });

    hideNeedInput();
    if (errorDetail) throw new Error(errorDetail);
    if (!doneData) throw new Error("事件流意外中断，没有收到最终结果");
    renderConsultResult(doneData);
  } catch (err) {
    console.error("consult failed:", err);
    showError(`请求失败：${err.message || err}\n${(err.stack || "").split("\n").slice(0, 3).join("\n")}`);
  } finally {
    btn.disabled = false;
    btn.textContent = "辨证";
    status.textContent = "";
    currentStreamId = null;
  }
}

document.getElementById("submit-btn").addEventListener("click", submitConsult);
document.getElementById("need-input-submit").addEventListener("click", submitNeedInputAnswer);
document.getElementById("need-input-answer").addEventListener("keydown", (e) => {
  if (e.key === "Enter") submitNeedInputAnswer();
});
document.getElementById("skip-btn").addEventListener("click", skipAnimation);
document.getElementById("replay-btn").addEventListener("click", replayGraph);
// 保险起见运行时把面板挂到 body 末尾：只要祖先里有任何 transform/filter，
// position:fixed 就会相对该祖先定位而不是视口，面板会跑到页面中间去。
{
  const _p = document.getElementById("evidence-panel");
  if (_p && _p.parentElement !== document.body) document.body.appendChild(_p);
}
document.getElementById("evidence-close").addEventListener("click", closeEvidence);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeEvidence();
});
</script>

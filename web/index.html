<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>名医辨证对照</title>
<!-- 内联 data URI 的 favicon：不额外加静态文件，也不再每次加载吃一个 404。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b5bdb'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E8%AF%81%3C/text%3E%3C/svg%3E" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <h1>名医辨证对照</h1>
  <!-- M8：定位表述分模式——患者/学生/研究者模式沿用原文案，医生模式换成
       任务描述原文给的处方辅助工具表述（见 describeDisclaimer()）。这里的
       初始文案是默认角色 researcher 对应的那句，JS 在 role-select 变化时
       会原地替换，不是另起一块只在医生模式下才出现的提示——同一个位置，
       内容跟着角色换，位置本身不该因为角色不同而消失或新增。 -->
  <div class="disclaimer" id="disclaimer-text">教学与研究用途，非诊断工具，不能替代执业医师</div>
</header>

<div id="demo-mode-banner"></div>

<div id="tab-bar">
  <button class="tab-btn active" id="tab-btn-consult" data-tab="consult">问诊</button>
  <button class="tab-btn" id="tab-btn-graph-browser" data-tab="graph-browser">图谱浏览器</button>
</div>

<main>
<div id="tab-consult" class="tab-panel">
  <div id="divergence-banner"></div>
  <div id="error-box" role="alert" aria-live="assertive"></div>
  <div id="safety-flag-note" role="alert" aria-live="assertive"></div>
  <!-- A2：患者模式导诊面板。后端在 role=patient 时下发 triage/food_therapy/
       patent_medicines 三个字段，之前前端一个都没渲染。 -->
  <div id="triage-box"></div>

  <div id="graph-panel">
    <div id="graph-toolbar">
      <button class="ghost-btn" id="skip-btn" title="立即显示终态">⏭ 跳过动画</button>
      <button class="ghost-btn" id="replay-btn" title="重新播放生长过程">↻ 重播</button>
    </div>
    <div id="cy"></div>
    <div id="residual-note" style="display:none;position:absolute;bottom:26px;left:14px;font-size:12px;color:#C2410C;"></div>
  <div id="graph-note" style="display:none;position:absolute;bottom:8px;left:14px;font-size:12px;color:#9a6b2f;"></div>
  <div id="graph-tooltip" class="gt-tooltip"></div>
  </div>

  <div id="input-panel">
    <textarea id="complaint" placeholder="请输入患者主诉，例如：胃脘胀痛，食后加重，嗳气泛酸，舌淡红苔薄白，脉弦。"></textarea>
    <div class="input-row">
      <span id="status-text"></span>
      <label id="retriever-mode-label" for="retriever-mode">检索模式</label>
      <select id="retriever-mode">
        <option value="">默认</option>
        <option value="hybrid">hybrid（稠密+BM25 融合）</option>
        <option value="dense">dense（稠密向量）</option>
        <option value="bm25">bm25（关键词）</option>
        <option value="graph">graph（证素索引）</option>
      </select>
      <!-- M7 只放了 researcher/student——patient 的专属界面（导诊横幅）仍是
           未排期工作，这里还是不摆；doctor 的专属界面（可编辑处方表）M8 做了，
           加回这个选项。 -->
      <label id="role-select-label" for="role-select">查看模式</label>
      <select id="role-select">
        <option value="researcher" selected>研究者（完整信息）</option>
        <option value="student">学生（教学展开）</option>
        <option value="doctor">医生（可编辑处方）</option>
        <!-- A2：后端 api/main.py:36 的 Role 四种角色一直齐全，README 也写着
             "四种模式"、DEMO.md 第 5 点写着"『查看模式』切到『患者』"，但
             这个 option 从来没加过——照 DEMO.md 演示会当场找不到它。 -->
        <option value="patient">患者（导诊，不提供方药）</option>
      </select>
      <button id="submit-btn">辨证</button>
      <!-- E1：一次问诊是分钟级（v4-pro + ReAct），原来点下去就只能等或刷新
           整个页面。取消按钮平时不显示，跑起来才出现。 -->
      <button id="cancel-btn" style="display:none;">取消</button>
    </div>
    <!-- D1：BYOK + 共享额度 + 用量看板。key 只存 sessionStorage（关标签页就没了），
         随请求走 X-LLM-Key 头，服务端不落盘、不进日志、不进 manifest。 -->
    <div id="usage-bar" role="status" aria-live="polite">
      <span id="usage-text" class="grow"></span>
      <label for="byok-key" style="font-size:12px;">自带 API key</label>
      <input id="byok-key" type="password" autocomplete="off" spellcheck="false"
             placeholder="sk-…（只存在本标签页；建议用额度有限的临时 key）" />
      <button id="byok-save">使用</button>
      <button id="byok-clear">清除</button>
    </div>
    <!-- M8：doctor_id/patient_ref 只在医生模式下有意义（导出接口需要），
         其余模式下这两个字段不出现——不是禁用置灰，是压根不摆出来，跟
         patient/doctor 模式后端字段裁剪同一条"不该看到的东西不摆出来"的
         精神，只是这里是前端表单层面的，不是安全边界。 -->
    <div class="input-row" id="doctor-id-row" style="display:none;">
      <label id="doctor-id-label" for="doctor-id-input">医生标识</label>
      <input type="text" id="doctor-id-input" placeholder="例如：dr_ye（导出处方必填）" style="flex:1;padding:7px 8px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:12.5px;" />
      <label id="patient-ref-label" for="patient-ref-input">患者标识（可选）</label>
      <input type="text" id="patient-ref-input" placeholder="例如：门诊号/化名" style="flex:1;padding:7px 8px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:12.5px;" />
    </div>
    <div id="progress-log" role="status" aria-live="polite"></div>
    <div id="need-input-box">
      <div id="need-input-question"></div>
      <div class="input-row" style="justify-content: flex-start;">
        <input type="text" id="need-input-answer" placeholder="请输入回答，例如：有 / 没有" />
        <button id="need-input-submit">回答</button>
      </div>
    </div>
  </div>

  <div id="results"></div>

  <div id="manifest-footer" style="margin:18px 0 8px;font-size:11px;color:var(--muted);text-align:center;"></div>
</div>

<div id="tab-graph-browser" class="tab-panel" hidden>
  <div id="gb-lambda1-note"></div>
  <div id="gb-error-box"></div>
  <div id="gb-toolbar">
    <input type="text" id="gb-search" placeholder="搜索症状 / 证素 / 证型…" />
    <button class="ghost-btn" id="gb-search-btn">搜索</button>
    <span id="gb-search-status"></span>
    <select id="gb-physician-select"></select>
    <button class="ghost-btn" id="gb-layer-toggle" hidden>切换到医案层</button>
    <button class="ghost-btn" id="gb-more" hidden>加载更多证型</button>
    <button class="ghost-btn" id="gb-reset-btn">重置视图</button>
  </div>
  <div id="gb-panel">
    <div id="gb-cy"></div>
    <div id="gb-tooltip" class="gt-tooltip"></div>
    <div id="gb-empty-hint">加载中…</div>
  </div>
  <div id="gb-stats"></div>
</div>
</main>
<aside id="evidence-panel" role="dialog" aria-modal="false" aria-label="证据详情" aria-hidden="true">
    <div id="evidence-head">
      <span id="evidence-title"></span>
      <button id="evidence-close" title="关闭">×</button>
    </div>
    <div id="evidence-body"></div>
  </aside>


<script src="graph.js"></script>
<script src="app.js"></script>

</body>
</html>

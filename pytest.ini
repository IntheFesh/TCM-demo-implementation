[pytest]
# 不把所有告警一律升级为 error：第三方库（如 starlette/anyio）的 DeprecationWarning
# 不在本项目控制范围内。只把本项目源码里的语法问题升级为 error：
#   - `\|` 这类非法转义序列：3.11 是 DeprecationWarning，3.12 起是 SyntaxWarning，
#     更新的版本会直接变成 SyntaxError。
# 不写 `default`：那会重置 pytest 的默认过滤器，让平时被忽略的 ResourceWarning 等全部输出。
filterwarnings =
    error::SyntaxWarning
    error:invalid escape sequence:DeprecationWarning

# 上面的 filter 只在源码被编译时生效；__pycache__ 命中时 import 不会重新编译，
# 所以 tests/test_source_hygiene.py 直接 compile 源文件做同样的检查。

# 需要真实 sentence-transformers 模型（约 400MB）的用例标记这个 marker。默认所有用例
# 使用 tests/conftest.py 里的确定性假编码器，只有标记的用例才加载真实模型：
#   pytest -m "not real_embedding"   内存受限的环境先跑这一批
#   pytest -m real_embedding         剩下的用例单独跑
markers =
    real_embedding: 需要真实 sentence-transformers 模型，内存占用高，单独跑

[pytest]
# **不把所有告警一刀切成 error。** starlette 那条 anyio DeprecationWarning 是第三方
# 的、我们改不了，全局 error 会让整批 API 测试红掉，然后被人加一条 ignore 绕过去
# ——那比不设更糟（一条被绕过的闸门看起来还在，实际已经关掉了）。
# 只把**我们自己代码里的语法问题**变成 error：
#   - `\|` 这类非法转义序列：3.11 是 DeprecationWarning，3.12 起是 SyntaxWarning，
#     3.14 会直接变成 SyntaxError。现在红总比那天整个包 import 不进来强。
# **不写 `default`**：那一条会把 pytest 自己的默认过滤器全部重置成"都显示"，
# 连 ResourceWarning 这类平时被 Python 默认忽略的也会冒出来，输出一下子变吵，
# 而吵到没人看的输出等于没有输出。这里只追加两条 error，pytest 的默认行为不动。
filterwarnings =
    error::SyntaxWarning
    error:invalid escape sequence:DeprecationWarning

# 这两条 filter 有一个盲区，**靠 tests/test_source_hygiene.py 补**：CPython 把 .py
# 编译成 .pyc 之后不会再编译第二次，__pycache__ 是热的时候 import 根本不触发编译，
# 上面那条 filter 就永远等不到那个告警。实测：清 __pycache__ 之前 pytest 报
# "1 warning"，清掉之后才报 2 条。那个测试不走 import、直接 compile 源文件。

# 需要**真** sentence-transformers 模型（约 400MB）的用例标这个 marker。默认所有
# 用例走 tests/conftest.py 里的确定性假编码器；标了的才真加载。
#   pytest -m "not real_embedding"   无卡模式 2GB 上能跑完的那一批
#   pytest -m real_embedding         剩下那几条，单独跑
# 理由：无卡模式 2GB 上实测全量测试 34% 被 OOM 杀掉（退出码 137，只留一个 Killed，
# 看不出是哪条），而绝大多数用例根本不关心向量的语义质量。
markers =
    real_embedding: 需要真实 sentence-transformers 模型，内存占用高，单独跑

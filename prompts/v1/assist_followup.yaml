system: |
  这是一次**复诊**。患者上次按下面那张方服了药，现在回来了。

  你只做一件事：**根据服药后的变化，判断这张方该不该改、怎么改**。

  ## 你不做什么

  **不重新辨一次证。** 证型在上次已经定了，这次的任务是评估它对不对、
  方子起没起作用——不是从头再推一遍。真要推翻上次的证型，那属于
  "改法换方"这一档，在 `reason` 里说清楚凭什么推翻，而不是另给一份辨证。

  **不说"建议服用""推荐处方""治疗建议"。**

  ## verdict：三选一

  - **效不更方**：症状按预期在减轻，方向对了。原方续服。
  - **守法调量**：方向对但力道不够或太过——治法不变，只调剂量／加减一两味。
  - **改法换方**：服药后没有变化，或出现了原方解释不了的新症状。
    这一档要在 `reason` 里说清**凭哪几条判断原来的治法不成立**。

  判据看的是**服药后的变化**，不是症状本身的轻重：一个仍然很重但明显在
  减轻的症状支持"效不更方"，一个不重但一点没动的症状支持"改法换方"。

  ## 其余三个字段

  - `reason`：一句话说清为什么是这个判断。
  - `based_on`：服药后的变化里，**哪几条支持这个判断**。逐条照抄患者
    这次说的话，不要换成你的概括——这一栏是给医师核对用的。
  - `changes`：机器可执行的改动，`action` 从 加 / 减 / 改量 / 改炮制 /
    改煎法 里选，`item` 是一味药的完整字段。**「效不更方」时这里是空数组**
    ——那个判断本来就意味着不改任何东西，硬编一处改动出来是自相矛盾。
  - `next_visit`：下次什么时候再看。说不出就留空串，不要编一个"七日后复诊"。

  只输出符合 schema 的 JSON，不要输出解释或 markdown 围栏。

  ## 上一诊

  证型：$syndrome
  治法：$principle

  上次的方（$doses_count 剂，$usage）：
  $prev_herbs

  ## 这一次

  患者概况：
  $profile

  服药后的变化、新出现的症状：
  $changes_text

  医师的用药习惯（忌用药不要出现在建议里）：
  $preferences
notes: |
  R62 §6.2 复诊调方的 prompt。

  ## 为什么不改 s3_derived.yaml 而是另起一份

  两个理由，缺一个都不足以另起一份 prompt：

  1. **问的不是同一个问题。** `s3_derived` 回答"这个证怎么从症状推出来"，
     它的五步链校验（不可跳步、每步 rule_refs 或 insufficient）对一次
     「效不更方」的判断完全不适用——那个判断没有"病位→证型→治法"这条链
     可走，它走的是"上次这么治了，结果如何"。
  2. **基线。** R52~R61 全部的消融数字都是在现在这份 s3_derived 下跑出来
     的，给它加一个条件分支（有上一诊时多塞一段）会让那些数字不再可比，
     而这一轮（§0）明确取消一切效果评测、不该动评测的地基。

  ## 调用参数

  `thinking=disabled`、`reasoning_effort=low`，跟另外两个轻量能力同一档
  （`core/assist.py::_run_light_llm`）——它不是重新辨证，是就着已经定下来的
  证型治法做一次评估。

  ## 占位符

  $syndrome / $principle / $doses_count / $usage / $prev_herbs / $profile /
  $changes_text / $preferences。

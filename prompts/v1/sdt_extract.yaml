system: |
  下面是一份中医医案的原始记录。请把其中描述患者临床表现的短语原样摘出来，
  包括症状、体征、舌象、脉象。

  硬要求：
  - **原样摘录，不要改写、不要归一化、不要换成标准术语。** 原文写「呃逆嗳气」
    就摘「呃逆嗳气」，不要写成「嗳气」或「胃气上逆」。这一项按字符串完全相等
    评分，改一个字就算错。
  - 一条一个短语，不要把几条并成一句，也不要加标点或编号。
  - 只摘患者身上的表现。不要摘病史叙述（「有呃逆病史10余年」）、检查结论
    （「未发现器质性病变」）、治疗经过、医生的判断。
  - 舌象脉象要摘，按原文的写法（「舌苔薄白」「脉浮大数」）。

  医案原文：
  $clinical_data

  只输出符合 schema 的 JSON，不要输出解释或 markdown 围栏。
notes: "喂给 eval.sdt.adapter.ExtractedInfo。对应 TCMEval-SDT 的 Task1，按字符串完全相等评分，所以必须原样摘录。"

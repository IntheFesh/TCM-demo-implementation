notes: "喂给 core.schemas.S3Syndrome 与 S3SyndromeUnreferenced（后者检索为空时用，
  没有 cited_case_ids 字段，其余要求一致——项目里只有这一份 s3 prompt yaml，
  两条路径共用，靠 generate() 传入的 schema 不同来区分，不是两份 prompt 文件，
  见 core/chain.py 的 s3_schema 选择逻辑）。$name 为医家中文名，$refs 为紧凑
  格式的参考医案文本，由 core/chain.py 拼装。disease/formula_candidates/
  herb_items 等字段的语义要求全部写在 system 里、不靠 schema hint 单独表达——
  M1 阶段裸 schema hint 在一次真实调用里凑巧给出了不错的结果（多候选方、
  role 填得完整），但那是运气，没有 prompt 层面的约束保证，M3 就是要把这份
  运气换成明文约束（尤其是「至少一个 classic」「不要三个都填 high」这两条，
  schema 本身表达不出这种跨字段的软约束）。M3 真实产出（3 条主诉的格式
  遵从度）见模块报告，不写死在这里——写死了下次改 prompt 没人会记得回来更新。"

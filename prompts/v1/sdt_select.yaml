system: |
  下面是一份中医医案，以及两组备选项。请分别选出符合这个医案的病机和证型。

  $reasoning_block

  医案原文：
  $clinical_data

  【病机备选项】
  $pathogenesis_options

  【证型备选项】
  $syndrome_options

  要求：
  - 每组可以多选，也可以只选一个。选项字母只能来自上面给出的字母，不要编造。
  - **漏选比选错更贵，拿不准的也要选上。** 官方公式是
    `score = max × correct / (len(gold) + wrong)`：金标准 3 个时，少一个对的丢
    0.333 分，多一个错的只丢 0.250 分。Test 50 条实测（2026-09-15）少选率 45.0%、
    多选率 17.0%，单个漏选值 0.1425 分、单个错选 0.0544 分——**一个漏选贵 2.6 倍**。
    所以：有把握的全选上，沾边但不确定的也选上；只在明显不相关时才不选。
  - 两组分别判断：病机是病理机转（「热伤肺络」），证型是证候名（「血热妄行」），
    不要把同一个判断在两组里各选一遍。

  只输出符合 schema 的 JSON，不要输出解释或 markdown 围栏。
notes: "喂给 eval.sdt.adapter.SelectedOptions。Task2+Task3 合并成一次调用——两问针对同一份医案，拆两次只是多花一倍钱。$reasoning_block 由 ChainSolver 注入我们自己的证素分析，BaselineSolver 传空串。"

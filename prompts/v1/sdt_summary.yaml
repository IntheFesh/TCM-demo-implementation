system: |
  下面是一份中医医案。请写一段辨证分析，格式与中医医案书籍的「临证体会」一致。

  $reasoning_block

  医案原文：
  $clinical_data

  要求：
  - 先写病机分析：从症状推病机，讲清楚为什么。
  - 最后一句用「辨证：」开头，给出证型名，不超过 20 字。
  - 全文 100-200 字，不要分段，不要用列表。

  只输出符合 schema 的 JSON，不要输出解释或 markdown 围栏。
notes: "喂给 eval.sdt.adapter.CaseSummary。对应 Task4，按 ROUGE-L 与金标准比。金标准的固定骨架是「临证体会：…辨证：…」，这里要求同样的骨架是为了对齐输出体裁，不是为了刷 LCS——骨架本身只有几个字，分数主要来自病机分析的实质内容。"
